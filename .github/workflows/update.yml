name: Update DPU Monitor

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours; the daily recheck runs once per day (after 6 a.m. Eastern when possible)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dpu-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the data saved by the last run
        run: |
          git clone --depth 1 --branch data "https://github.com/${{ github.repository }}.git" out || mkdir -p out
          rm -rf out/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Update from the DPU File Room
        run: python monitor.py --out out

      - name: Save the data for the next run
        run: |
          cd out
          git init -q -b data
          git config user.name "dpu-monitor-bot"
          git config user.email "dpu-monitor-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
